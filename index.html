<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>보카로 트렌드</title>
    <meta
      name="description"
      content="한국과 일본 행사 셋리스트에 쓰인 보카로 곡. 행사에서 쓰기 좋은 곡 위주라서 유명하다고 다 있는 건 아니에요."
    />
    <!-- 링크 미리보기 (og:image 는 절대 주소여야 한다) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://vocaro.witch.work/" />
    <meta property="og:title" content="보카로 트렌드" />
    <meta
      property="og:description"
      content="한국과 일본 행사 셋리스트에 쓰인 보카로 곡. 행사에서 쓰기 좋은 곡 위주라서 유명하다고 다 있는 건 아니에요."
    />
    <meta property="og:image" content="https://vocaro.witch.work/og.jpg" />
    <meta property="og:image:width" content="2000" />
    <meta property="og:image:height" content="1050" />
    <meta property="og:locale" content="ko_KR" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- ?s=&q=&sort=&lang= 이 붙은 주소를 모두 한 페이지로 본다 -->
    <link rel="canonical" href="https://vocaro.witch.work/" />
    <!-- 검색 결과에 보일 사이트 이름 -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "보카로 트렌드",
        "alternateName": ["ボカロトレンド", "Vocaro Trend"],
        "url": "https://vocaro.witch.work/",
        "inLanguage": ["ko", "ja"]
      }
    </script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <a id="lang" class="lang" href="?lang=ja">日本語</a>
      <h1><a id="home" href="./">보카로 트렌드</a></h1>
      <p class="lead">
        한국과 일본 행사 셋리스트에 쓰인 보카로 곡. 행사에서 쓰기 좋은 곡
        위주라서 유명하다고 다 있는 건 아니에요.
      </p>
      <div class="controls">
        <input
          id="q"
          type="search"
          placeholder="제목, P, 보컬 검색"
          aria-label="검색"
        />
        <select id="sort" aria-label="정렬"></select>
        <label class="toggle"
          ><input id="autoplay" type="checkbox" />
          <span id="autoplay-label">자동재생</span></label
        >
        <button id="play-all" type="button">▶ 목록 연속 재생</button>
      </div>
      <nav id="sections" class="tags" aria-label="섹션"></nav>
      <p id="section-desc" class="desc"></p>
    </header>
    <main id="list"></main>

    <dialog id="detail" aria-labelledby="detail-title">
      <form method="dialog">
        <button class="close" aria-label="닫기">✕</button>
      </form>
      <div id="detail-content"></div>
    </dialog>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
