<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>보카로 트렌드</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>보카로 트렌드</h1>
      <p class="lead">한국과 일본 행사 셋리스트에 쓰인 보카로 곡</p>
      <div class="controls">
        <input id="q" type="search" placeholder="제목, P, 보컬 검색" aria-label="검색" />
        <select id="sort" aria-label="정렬">
          <option value="">추천순</option>
          <option value="-stats.events">행사 많은 순</option>
          <option value="-pub">최신 발표순</option>
          <option value="title">제목순</option>
        </select>
        <label class="toggle"><input id="autoplay" type="checkbox" /> 자동재생</label>
      </div>
      <nav id="sections" class="tags" aria-label="섹션"></nav>
      <p id="section-desc" class="desc"></p>
    </header>
    <main id="list"></main>

    <dialog id="detail" aria-labelledby="detail-title">
      <form method="dialog">
        <button class="close" aria-label="닫기">✕</button>
      </form>
      <div id="detail-content"></div>
    </dialog>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
